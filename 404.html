<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — No such file or directory</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#010409" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
/* Deliberately not a copy of the site stylesheet — this page is one paragraph
   and a link, and duplicating 300 lines of CSS to render it would be worse
   than the small amount of repetition here. */
@font-face {
  font-family: 'JetBrains Mono';
  src: url('assets/jetbrains-mono-latin.woff2') format('woff2');
  font-weight: 100 800;
  font-style: normal;
  font-display: swap;
}

:root {
  --bg: #0d1117; --frame: #161b22; --border: #30363d; --text: #e6edf3;
  --green: #3fb950; --cyan: #39c5cf; --muted: #8b949e; --page: #010409;
  --shadow: 0 18px 50px rgba(0, 0, 0, .55);
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: #ffffff; --frame: #f6f8fa; --border: #d1d9e0; --text: #1f2328;
    --green: #1a7f37; --cyan: #0550ae; --muted: #59636e; --page: #eef1f4;
    --shadow: 0 18px 50px rgba(31, 35, 40, .16);
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: var(--page);
  color: var(--text);
  font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 15px;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
}

.window {
  width: 100%;
  max-width: 720px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: var(--shadow);
  overflow: hidden;
}

.titlebar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  background: var(--frame);
  border-bottom: 1px solid var(--border);
  user-select: none;
}
.dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.dot.red { background: #ff5f57; }
.dot.amber { background: #febc2e; }
.dot.green { background: #28c840; }
.title {
  flex: 1; text-align: center; color: var(--muted); font-size: .82rem;
  margin-left: -34px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.screen { padding: 18px; }
p { margin: 0; }
.spacer { height: 1.6em; }
.prompt { color: var(--green); font-weight: 700; }
.cmd { color: var(--cyan); }
.err { color: #ff7b72; }
.muted { color: var(--muted); }
a { color: var(--cyan); text-decoration: underline; text-underline-offset: 2px; }
a:hover { color: var(--green); }
a:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; border-radius: 2px; }

@media (max-width: 640px) {
  html, body { font-size: 13.5px; }
  .screen { padding: 14px; }
}
</style>
</head>
<body>

<main class="window">
  <div class="titlebar">
    <span class="dot red" aria-hidden="true"></span>
    <span class="dot amber" aria-hidden="true"></span>
    <span class="dot green" aria-hidden="true"></span>
    <span class="title">alex@sydney: ~/portfolio</span>
  </div>

  <div class="screen">
    <p><span class="prompt">visitor@alvarie:~$</span>
      <span class="cmd">cd <span id="path">/404</span></span></p>
    <p class="err">bash: cd: <span id="path2">/404</span>: No such file or directory</p>
    <div class="spacer"></div>
    <p>That path doesn't exist. Everything lives at the root.</p>
    <div class="spacer"></div>
    <p><a href="/">cd ~</a> <span class="muted">— back to the terminal</span></p>
  </div>
</main>

<script>
(function () {
  "use strict";
  // textContent, never innerHTML — the path comes straight from the URL bar.
  var path = location.pathname + location.search;
  if (path && path !== "/") {
    document.getElementById("path").textContent = path;
    document.getElementById("path2").textContent = path;
  }
})();
</script>
</body>
</html>
